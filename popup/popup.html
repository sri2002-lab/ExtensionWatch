<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExtensionWatch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 420px;
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      background: #f8f9fa;
      color: #1a1a1a;
    }

    @media (min-width: 600px) {
      body {
        max-width: 420px;
        margin: 40px auto;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      }
    }

    .header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }

    .header-icon {
      width: 34px; height: 34px;
      background: #1a73e8;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 12px; font-weight: 800;
    }

    .header-title { font-size: 14px; font-weight: 700; color: #1a1a1a; }
    .header-sub { font-size: 11px; color: #888; margin-top: 1px; }

    .active-pill {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: 600;
    }

    .status-banner {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #eee;
    }

    .status-banner.clear   { background: #f0fdf4; border-left: 4px solid #34a853; }
    .status-banner.caution { background: #fffde7; border-left: 4px solid #f9ab00; }
    .status-banner.risk    { background: #fef2f2; border-left: 4px solid #ea4335; }

    .status-icon { font-size: 26px; flex-shrink: 0; }
    .status-title { font-size: 14px; font-weight: 700; color: #1a1a1a; }
    .status-desc { font-size: 11px; color: #666; margin-top: 2px; line-height: 1.4; }

    .stats-row {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .stat-box {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      border-right: 1px solid #eee;
    }

    .stat-box:last-child { border-right: none; }
    .stat-n { font-size: 20px; font-weight: 800; color: #1a1a1a; }
    .stat-n.red    { color: #ea4335; }
    .stat-n.yellow { color: #f9ab00; }
    .stat-n.green  { color: #34a853; }

    .stat-l {
      font-size: 9px; color: #999;
      margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em;
    }

    .tabs {
      display: flex;
      background: #fff;
      border-bottom: 2px solid #eee;
    }

    .tab {
      flex: 1; padding: 10px 4px;
      text-align: center;
      font-size: 11px; font-weight: 600;
      color: #999;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
    }

    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }

    .tab-content { display: none; max-height: 380px; overflow-y: auto; }
    .tab-content.active { display: block; }

    .section-label {
      font-size: 10px; font-weight: 700;
      color: #999; text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 12px 16px 6px;
    }

    .alert-card {
      margin: 0 12px 8px;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }

    .alert-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    .alert-card-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .alert-card-left { flex: 1; min-width: 0; }

    .alert-name {
      font-size: 12px; font-weight: 700; color: #1a1a1a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .alert-meta { font-size: 10px; color: #999; margin-top: 2px; }

    .alert-card-right {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }

    .risk-badge {
      font-size: 9px; font-weight: 700;
      padding: 3px 8px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    .risk-badge.high   { background: #fce8e6; color: #c5221f; }
    .risk-badge.medium { background: #fef7e0; color: #b06000; }
    .risk-badge.low    { background: #e6f4ea; color: #1e7e34; }

    .expand-arrow {
      font-size: 10px; color: #bbb;
      transition: transform 0.2s;
    }

    .alert-card.expanded .expand-arrow { transform: rotate(180deg); }

    .perm-row {
      padding: 0 12px 10px;
      display: flex; flex-wrap: wrap; gap: 4px;
    }

    .perm-tag {
      font-size: 10px;
      padding: 2px 7px; border-radius: 4px;
      font-family: 'Consolas', monospace;
      background: #f0f0f0; color: #555;
    }

    .perm-tag.flagged { background: #fce8e6; color: #c5221f; }

    .alert-detail {
      display: none;
      padding: 10px 12px 12px;
      border-top: 1px solid #f0f0f0;
      background: #fafafa;
    }

    .alert-card.expanded .alert-detail { display: block; }

    .detail-reason {
      font-size: 11px; color: #444;
      line-height: 1.6; margin-bottom: 8px;
    }

    .detail-advice {
      font-size: 11px; color: #555;
      background: #fffde7;
      border: 1px solid #fff176;
      border-radius: 6px;
      padding: 8px 10px;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .detail-disclaimer {
      font-size: 10px; color: #999;
      font-style: italic;
      margin-bottom: 8px;
      line-height: 1.5;
      padding: 6px 8px;
      background: #f5f5f5;
      border-radius: 4px;
      border-left: 3px solid #ddd;
    }

    .docs-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; color: #1a73e8; text-decoration: none;
      margin-bottom: 8px;
    }

    .docs-link:hover { text-decoration: underline; }

    .clear-btn {
      display: block;
      margin-top: 10px;
      width: 100%;
      padding: 7px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fff;
      color: #666;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .clear-btn:hover { background: #f5f5f5; color: #333; }

    .clear-btn.restore {
      background: #e8f0fe;
      color: #1a73e8;
      border-color: #c5d8fd;
    }

    .clear-btn.restore:hover { background: #d2e3fc; }

    .empty {
      padding: 32px 16px; text-align: center;
    }

    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-title { font-size: 13px; font-weight: 700; color: #444; margin-bottom: 4px; }
    .empty-sub { font-size: 11px; color: #888; line-height: 1.6; }

    .ext-row {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid #f5f5f5;
      gap: 8px;
      background: #fff;
    }

    .ext-row:last-child { border-bottom: none; }

    .ext-name {
      font-size: 11px; color: #333;
      flex: 1; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }

    .ext-ver { font-size: 10px; color: #bbb; flex-shrink: 0; }

    .footer {
      border-top: 1px solid #eee;
      padding: 8px 16px;
      font-size: 10px; color: #bbb;
      text-align: center;
      background: #fff;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #f8f9fa; }
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
  </style>
</head>

<body>
  <div class="header">
    <div class="header-left">
      <div class="header-icon">EW</div>
      <div>
        <div class="header-title">ExtensionWatch</div>
        <div class="header-sub">Permission monitor</div>
      </div>
    </div>
    <div class="active-pill">● Active</div>
  </div>

  <div class="status-banner clear" id="statusBanner">
    <div class="status-icon" id="statusIcon">✅</div>
    <div>
      <div class="status-title" id="statusTitle">All Clear</div>
      <div class="status-desc" id="statusDesc">Checking extensions...</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-n" id="totalCount">—</div>
      <div class="stat-l">Monitored</div>
    </div>
    <div class="stat-box">
      <div class="stat-n red" id="highCount">—</div>
      <div class="stat-l">High Risk</div>
    </div>
    <div class="stat-box">
      <div class="stat-n yellow" id="medCount">—</div>
      <div class="stat-l">Caution</div>
    </div>
    <div class="stat-box">
      <div class="stat-n green" id="safeCount">—</div>
      <div class="stat-l">Safe</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="alerts">🔔 Alerts</div>
    <div class="tab" data-tab="extensions">📋 Extensions</div>
    <div class="tab" data-tab="history">🕘 Past Activity</div>
  </div>

  <div class="tab-content active" id="tab-alerts">
    <div id="alertsContainer"></div>
  </div>

  <div class="tab-content" id="tab-extensions">
    <div id="extensionsContainer"></div>
  </div>

  <div class="tab-content" id="tab-history">
    <div id="historyContainer"></div>
  </div>

  <div class="footer" id="footerText">ExtensionWatch — Permission Monitor</div>

  <script src="popup.js"></script>
</body>
</html>
